[project]
name = "backend-v2"
version = "0.0.1"
description = "From-scratch reimplementation of the autotrader backend."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "db*", "jobs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
