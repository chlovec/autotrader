# Containerized version of the same processes bin/restart.sh backgrounds locally -
# see README.md "Deploying" > "Option C: Docker Compose".
#
# Every account's broker/mode/strategy comes from .env's ACCOUNT_IDS/ACCOUNT_<id>_* vars
# (see .env.example) - the engine service trades every active one, no per-process broker
# selection anymore. There's no interactive "type yes" live-trading confirmation here (no
# terminal attached) - same reasoning README.md already gives for launchd/systemd: set
# .env explicitly and mean it before going live this way.
x-python-service: &python-service
  build: .
  image: autotrader-app
  env_file: .env
  # TWS/Gateway (an account with BROKER=ibkr) runs on the host, not in a container - set
  # that account's IBKR_HOST=host.docker.internal in .env to reach it. This resolves that
  # name on any platform (a no-op if no account uses ibkr).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./autotrader.db:/app/autotrader.db
    # Only needed for accounts with BROKER=questrade - each such account caches its
    # rotating refresh token in questrade_token_<account id>.json (see
    # engine/brokers/questrade_broker.py). Add one line per questrade account here,
    # e.g. "./questrade_token_questrade_main.json:/app/questrade_token_questrade_main.json"
    # (`touch` it on the host first, or Docker will create a directory instead of a file).

services:
  backend:
    <<: *python-service
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  engine:
    <<: *python-service
    command: python run_engine.py
    restart: unless-stopped

  # On-demand only - the backend already runs this nightly and exposes a
  # "run now" trigger. Invoke by hand: docker compose run --rm research
  research:
    <<: *python-service
    command: python run_research.py
    profiles: ["manual"]

  dashboard:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    restart: unless-stopped
